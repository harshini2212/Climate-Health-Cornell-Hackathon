name: check

# The merge gate: the mechanical half of review (every PR also gets a human review).
# A branch that is red here does not go to main. The `check` and `ui` jobs are the
# required status checks under main's branch protection.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Python comes from .python-version; --frozen installs exactly uv.lock and fails
      # if pyproject.toml has moved without re-locking.
      - name: Install
        run: |
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: ruff check leeward scripts tests

      - name: Types
        run: mypy leeward

      - name: Import layering
        run: lint-imports

      - name: Fixtures
        run: python scripts/make_fixtures.py

      - name: Tests
        run: pytest -n auto -rs

      # The `perf` timing tests, run on their own and serially, so parallel workers cannot
      # skew them. Their budgets were set on a laptop and a shared runner's speed varies run to
      # run (the toy fit took ~80 s here against the laptop's 60 s with no code change, so CI now gets 120 s), so a miss is
      # reported, not merge-blocking. The nightly schedule keeps a timing record on main.
      - name: Perf
        continue-on-error: true
        run: pytest -m perf -rs

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build
