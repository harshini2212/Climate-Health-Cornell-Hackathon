[project]
name = "leeward"
version = "0.1.0"
description = "Veteran care continuity under climate events — Health in Climate AI Hackathon NYC 2026"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0",
  "pyarrow>=16",
  "pandas>=2.2",
  "numpy>=1.26",
  "requests>=2.32",
  "pydantic>=2.7",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6",
  "numpyro>=0.15",
  "jax>=0.4.30",
  "arviz>=0.18",
  "plotly>=5.22",
]

[project.optional-dependencies]
geo = ["geopandas>=1.0", "shapely>=2.0", "pyproj>=3.6"]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.5", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow. `make check` is the gate and nobody is reading diffs, so lint
# must catch real bugs (undefined names, unused imports, mutable defaults) and stay
# quiet about style. A gate that cries wolf gets ignored, and then so does the review.
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]   # line length is advisory; B008 fights FastAPI's Depends()

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]        # bare asserts are the point of a test file

[tool.setuptools.packages.find]
include = ["leeward*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
