[project]
name = "leeward"
version = "0.1.0"
description = "Veteran care continuity under climate events — Health in Climate AI Hackathon NYC 2026"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0",
  "pyarrow>=16",
  "pandas>=2.2",
  "numpy>=1.26",
  "requests>=2.32",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6",
  "numpyro>=0.15",
  "jax>=0.4.30",
  "arviz>=0.18",
  "plotly>=5.22",
]

[project.optional-dependencies]
geo = ["geopandas>=1.0", "shapely>=2.0", "pyproj>=3.6"]
dev = [
  "pytest>=8", "pytest-xdist>=3", "ruff>=0.5", "httpx>=0.27",
  "mypy>=1.10", "pre-commit>=3.7", "detect-secrets>=1.5", "import-linter>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Timing tests are deselected by default: under `-n auto` they share the machine with every
# other worker and measure the contention, not the code. `make perf` runs them alone.
addopts = "-q -m 'not perf'"
markers = [
  "perf: asserts a wall-clock budget; run serially with `make perf`, not in `make check`",
  "slow: takes more than a few seconds; still part of `make check`, skip locally with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow. `make check` is the gate and nobody is reading diffs, so lint
# must catch real bugs (undefined names, unused imports, mutable defaults) and stay
# quiet about style. A gate that cries wolf gets ignored, and then so does the review.
select = ["F", "E", "W", "I", "B", "UP", "TID251"]
ignore = ["E501", "B008"]   # line length is advisory; B008 fights FastAPI's Depends()

[tool.ruff.lint.isort]
# `tests/tables.py` is ours, not a dependency; without this it sorts in with numpy.
known-first-party = ["leeward", "tables"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "TID251"]  # bare asserts are the point of a test file
# The synthetic world and the harness that grades against it may read each other; the
# make-time scripts may read both. Production code may not (see [tool.importlinter]).
"leeward/cohort/*" = ["TID251"]
"leeward/eval/*" = ["TID251"]
"scripts/*" = ["TID251"]

# The direct-import half of the first [tool.importlinter] contract, so `make check` (which
# runs ruff, not lint-imports) enforces it too. lint-imports in CI also catches indirect ones.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"leeward.cohort".msg = "production code never imports the synthetic cohort; observation fields are in leeward.model.observation"
"leeward.eval".msg = "production code never imports the eval harness"

[tool.mypy]
# Non-strict on purpose: catch wrong types where they are declared, do not demand that
# everything be annotated. Runs in CI and pre-commit as `mypy leeward`.
python_version = "3.11"
files = ["leeward"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["yaml", "plotly.*", "numpyro.*", "geopandas", "geopandas.*", "shapely", "shapely.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Modules with errors when mypy arrived (104 in total, 59 of them in discrimination.py,
# mostly polars' wide scalar unions). Fixing them is not a no-behaviour-change edit, so they
# are listed here instead. Remove a module from the list once it type-checks; do not add one.
module = [
  "leeward.api.main",
  "leeward.cohort.build",
  "leeward.cohort.medications",
  "leeward.cohort.simulate",
  "leeward.decision.allocate",
  "leeward.eval.ablate",
  "leeward.eval.decision_quality",
  "leeward.eval.discrimination",
  "leeward.eval.fairness",
  "leeward.model.fit",
  "leeward.model.hazard",
  "leeward.model.score",
  "leeward.schema",
]
ignore_errors = true

[tool.setuptools.packages.find]
include = ["leeward*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# `lint-imports` (CI). Production is everything in `leeward` except the synthetic cohort and
# the eval harness that grades against it.
[tool.importlinter]
root_package = "leeward"

[[tool.importlinter.contracts]]
name = "Production never imports the synthetic cohort or the eval harness"
type = "forbidden"
source_modules = [
  "leeward.api", "leeward.contracts", "leeward.decision", "leeward.demo", "leeward.geo",
  "leeward.ingest", "leeward.model", "leeward.outreach", "leeward.schema", "leeward.settings",
]
forbidden_modules = ["leeward.cohort", "leeward.eval"]

[[tool.importlinter.contracts]]
name = "Only the API imports the API; shared types live in leeward.contracts"
type = "forbidden"
source_modules = [
  "leeward.cohort", "leeward.contracts", "leeward.decision", "leeward.demo", "leeward.eval",
  "leeward.geo", "leeward.ingest", "leeward.model", "leeward.outreach", "leeward.schema",
  "leeward.settings",
]
forbidden_modules = ["leeward.api"]
