# tau[a, k]: the fraction of need k that action a prevents, if it is done. SPEC §7.2.
# lead_days:  how many days BEFORE the risk day the action has to happen to work at all.
#
# Literature priors, editable. Every row names all five needs, each between 0 and 1, and a
# whole number of lead days. tau.load() and tau.leads() refuse anything else.
#
# The lead times are docs/proposal.md §6's action catalog, which lays the same actions out in
# "5 days out / 2 days out / during-after" columns. They are the same kind of clinician-set
# judgement as tau and belong in the same file: an alternate dialysis site booked on the day
# of the surge averts nothing, and a mail-order refill does not arrive the same afternoon.
# A call and a text still work on the day, so their lead is zero -- and so is evacuation
# assistance, because a flash flood gives no notice and help must still be offerable.
#
# check_in_call is deliberately absent: it prevents nothing by itself, it finds out.
# Its value is the information it buys -- see leeward/decision/eha.py -- and its lead is
# fixed at zero in tau.py, because a find-out call that is not made today cannot re-score
# today.
#
# assign_buddy and heap_application (SPEC §7.4b) join this table with caregiver routing.

#                             breathing   heat  mental  treatment_gap  access_loss   lead   bucket
