<polyline points="728,290 768,290" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#a)"/>
<text class="" x="736" y="274" font-size="12" fill="#5c5c5c">scores</text>
<polyline points="1078,290 1118,260" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#a)"/>
<text class="" x="1084" y="274" font-size="12" fill="#0d9488">actions</text>
<polyline points="1438,250 1458,250" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="328,538 350,603" fill="none" stroke="#5c5c5c" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text class="" x="334" y="524" font-size="12" fill="#5c5c5c">hazards</text>
<rect x="40" y="697" width="1390" height="160" rx="12" fill="#fff9db" stroke="#f08c00" stroke-width="1.5"/>
<circle cx="62" cy="723" r="4" fill="#f59f00"/>
<text class="hand" x="78" y="730" font-size="19" fill="#1e1e1e">eval/ — the gate that decides whether any of it is true</text>
<text class="" x="78" y="756" font-size="13" fill="#5c5c5c">parameter recovery against the planted truth · calibration (ECE) · posterior</text>
<text class="" x="78" y="772" font-size="13" fill="#5c5c5c">predictive checks · ablations</text>
<text class="" x="78" y="788" font-size="13" fill="#5c5c5c">decision quality: harm averted at K = 20/40/80 calls, vs rank-by-age,</text>
<text class="" x="78" y="805" font-size="13" fill="#5c5c5c">rank-by-chronic and random</text>
<text class="" x="78" y="821" font-size="13" fill="#5c5c5c">fairness audit by borough, HVI band, evacuation zone, income, caregiver status</text>
<text class="" x="78" y="837" font-size="13" fill="#5c5c5c">and race — a failing audit is displayed, never suppressed</text>
<polyline points="480,657 510,687" fill="none" stroke="#f08c00" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<polyline points="1250,512 1190,687" fill="none" stroke="#f08c00" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text class="" x="1240" y="683" font-size="12" fill="#f08c00">the honest half</text>
