<circle cx="1490" cy="813" r="4" fill="#2f9e44"/>
<text class="hand" x="1506" y="818" font-size="17" fill="#1e1e1e">Outcome log</text>
<text class="" x="1506" y="840" font-size="13" fill="#5c5c5c">done · reached · need occurred</text>
<text class="" x="1506" y="856" font-size="13" fill="#5c5c5c">20–30 rows a week, no retrain</text>
<polyline points="1470,833 760,833 760,663" fill="none" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text class="" x="720" y="819" font-size="12" fill="#2f9e44">what actually happened</text>
<text class="" x="40" y="920" font-size="13" fill="#5c5c5c">Synthetic people, real places.  ·  make demo boots offline in under 60 s.  ·  Health in Climate AI Hackathon, NYC 2026</text>
